name: Publish SDKs

# Publishes whichever SDKs a tag asks for. Tag formats:
#   v0.3.3            -> publish every registry (npm x2, PyPI, Maven Central)
#   npm-v0.3.3        -> npm only          (ziplogger + @ziplogger/browser)
#   pypi-v0.3.3       -> PyPI only         (ziplogger)
#   maven-v0.3.3      -> Maven Central only (dev.ziplogger:ziplogger)
#   gem-v0.4.0        -> RubyGems only      (ziplogger)
#   packagist-v0.4.0  -> PHP only; nothing to upload, Packagist reads the tag from this repo
#   sdk_go/v0.3.3     -> Go module tag; nothing to publish, the proxy reads the repo
#
# Secrets required (repository settings -> Secrets and variables -> Actions):
#   NPM_TOKEN              npm automation token with publish rights
#   MAVEN_CENTRAL_USERNAME Sonatype Central portal token username
#   MAVEN_CENTRAL_PASSWORD Sonatype Central portal token password
#   MAVEN_GPG_KEY          ASCII-armored private GPG key (Central requires signed artifacts)
#   MAVEN_GPG_PASSPHRASE   passphrase for that key
# PyPI and RubyGems both use Trusted Publishing (OIDC), so neither needs a secret.
# Packagist stores nothing here either: it indexes sdk_php/composer.json straight from this repo.

on:
  push:
    tags: ['v*', 'npm-v*', 'pypi-v*', 'maven-v*', 'gem-v*', 'sdk_go/v*', 'packagist-v*']
  workflow_dispatch:

jobs:
  npm:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required by --provenance, which signs the package to this repo and commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Test node SDK
        working-directory: sdk_node
        run: npm test
      - name: Test browser SDK
        working-directory: sdk_browser
        run: npm test
      # One tag publishes two packages that version independently, so the common case is that only
      # one of them has moved. npm answers a re-publish of an existing version with a 403, which
      # would fail the job — and, worse, fail it BEFORE the package that did change gets its turn.
      # Skipping a version that is already on the registry makes the tag mean "publish whatever is
      # new here", which is what a release tag should mean.
      - name: Publish ziplogger
        working-directory: sdk_node
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "ziplogger@$version" version >/dev/null 2>&1; then
            echo "ziplogger@$version is already on npm — nothing to publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ziplogger/browser
        working-directory: sdk_browser
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@ziplogger/browser@$version" version >/dev/null 2>&1; then
            echo "@ziplogger/browser@$version is already on npm — nothing to publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'pypi-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing: no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test
        working-directory: sdk_python
        run: python -m unittest discover -s tests -q
      - name: Build sdist + wheel
        working-directory: sdk_python
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk_python/dist


  rubygems:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'gem-v')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write   # Trusted Publishing: no API key needed
      contents: write   # required by rubygems/release-gem (it configures git for the release task)
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdk_ruby
      - name: Test
        working-directory: sdk_ruby
        run: bundle exec rake test
      - uses: rubygems/release-gem@v1
        with:
          working-directory: sdk_ruby

  maven:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'maven-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Test
        working-directory: sdk_java
        run: mvn -B -q test
      - name: Publish to Maven Central
        working-directory: sdk_java
        run: mvn -B -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  go:
    # Nothing to upload: the Go module proxy serves straight from this public repo.
    # This job just proves the tagged commit builds and passes its tests.
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'sdk_go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - working-directory: sdk_go
        run: |
          go vet ./...
          go test ./...

  php:
    # Nothing to upload: Packagist reads sdk_php/composer.json from this repo on every tag via
    # the GitHub webhook. This job proves the tagged commit installs and passes its tests.
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'packagist-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Install
        working-directory: sdk_php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Test
        working-directory: sdk_php
        run: vendor/bin/phpunit
      - name: Validate composer.json
        working-directory: sdk_php
        run: composer validate --strict
